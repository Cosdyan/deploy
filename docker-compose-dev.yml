services:
  worker:
    image: ghcr.io/cosdyan/aurora-admin-backend:latest
    restart: always
    command: bash worker.sh
    environment:
      PYTHONPATH: /app
      ENABLE_SENTRY: 'no'
      DATABASE_URL: 'postgresql://aurora:${AURORA_DB_PASSWORD:?Configure_AURORA_DB_PASSWORD_in_dotenv}@postgres:5432/aurora'
      ASYNC_DATABASE_URL: 'postgresql+asyncpg://aurora:${AURORA_DB_PASSWORD:?Configure_AURORA_DB_PASSWORD_in_dotenv}@postgres:5432/aurora'
      TRAFFIC_INTERVAL_SECONDS: 600
      DDNS_INTERVAL_SECONDS: 120
    volumes:
      - $HOME/.ssh/id_rsa:/app/ansible/env/ssh_key
      - app-data:/app/ansible/priv_data_dirs
      - file-data:/app/files

  backend:
    image: ghcr.io/cosdyan/aurora-admin-backend:latest
    restart: always
    command: sh -c "alembic upgrade heads && uvicorn app.main:app --host 0.0.0.0 --port 8888"
    environment:
      PYTHONPATH: /app
      DATABASE_URL: 'postgresql://aurora:${AURORA_DB_PASSWORD:?Configure_AURORA_DB_PASSWORD_in_dotenv}@postgres:5432/aurora'
      ASYNC_DATABASE_URL: 'postgresql+asyncpg://aurora:${AURORA_DB_PASSWORD:?Configure_AURORA_DB_PASSWORD_in_dotenv}@postgres:5432/aurora'
      ENABLE_SENTRY: 'no'
      SECRET_KEY: ${AURORA_SECRET_KEY:?Configure_AURORA_SECRET_KEY_in_dotenv}
    volumes:
      - app-data:/app/ansible/priv_data_dirs
      - file-data:/app/files
    depends_on:
      - postgres

  nginx:
    image: ghcr.io/cosdyan/aurora-admin-frontend:latest
    restart: always
    ports:
      - 8000:80
    depends_on:
      - backend

  redis:
    image: redis
    restart: always

  postgres:
    image: timescale/timescaledb:2.15.3-pg13
    command: postgres -c shared_preload_libraries=timescaledb
    restart: always
    environment:
      POSTGRES_USER: aurora
      POSTGRES_PASSWORD: ${AURORA_DB_PASSWORD:?Configure_AURORA_DB_PASSWORD_in_dotenv}
      POSTGRES_DB: aurora
    volumes:
      - db-data:/var/lib/postgresql/data
      
  
volumes:
  db-data:
  app-data:
  file-data:
