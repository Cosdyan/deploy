services:
  worker:
    image: ghcr.io/cosdyan/aurora-admin-backend:latest
    restart: always
    command: bash worker.sh
    environment:
      TZ: 'Asia/Shanghai'
      PYTHONPATH: /app
      ENABLE_SENTRY: 'no'
      DATABASE_URL: 'postgresql://aurora:${AURORA_DB_PASSWORD:?Configure_AURORA_DB_PASSWORD_in_dotenv}@postgres:5432/aurora'
      ASYNC_DATABASE_URL: 'postgresql+asyncpg://aurora:${AURORA_DB_PASSWORD:?Configure_AURORA_DB_PASSWORD_in_dotenv}@postgres:5432/aurora'
      TRAFFIC_INTERVAL_SECONDS: 600
      DDNS_INTERVAL_SECONDS: 120
    volumes:
      - $HOME/.ssh/id_rsa:/app/ansible/env/ssh_key
      - app-data:/app/ansible/priv_data_dirs
      - file-data:/app/files
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aurora
      - worker

  backend:
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8888), timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 10s
    image: ghcr.io/cosdyan/aurora-admin-backend:latest
    restart: always
    command: sh -c "alembic upgrade heads && uvicorn app.main:app --host 0.0.0.0 --port 8888"
    environment:
      TZ: 'Asia/Shanghai'
      PYTHONPATH: /app
      DATABASE_URL: 'postgresql://aurora:${AURORA_DB_PASSWORD:?Configure_AURORA_DB_PASSWORD_in_dotenv}@postgres:5432/aurora'
      ASYNC_DATABASE_URL: 'postgresql+asyncpg://aurora:${AURORA_DB_PASSWORD:?Configure_AURORA_DB_PASSWORD_in_dotenv}@postgres:5432/aurora'
      ENABLE_SENTRY: 'no'
      SECRET_KEY: ${AURORA_SECRET_KEY:?Configure_AURORA_SECRET_KEY_in_dotenv}
    volumes:
      - app-data:/app/ansible/priv_data_dirs
      - file-data:/app/files
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aurora

  nginx:
    image: ghcr.io/cosdyan/aurora-admin-frontend:latest
    restart: always
    environment:
      TZ: 'Asia/Shanghai'
    ports:
      - 8000:80
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - aurora

  redis:
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 40
    image: redis
    restart: always
    environment:
      TZ: 'Asia/Shanghai'
    networks:
      - aurora

  postgres:
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurora -d aurora"]
      interval: 3s
      timeout: 2s
      retries: 40
    image: timescale/timescaledb:2.15.3-pg13
    command: postgres -c shared_preload_libraries=timescaledb
    restart: always
    environment:
      TZ: 'Asia/Shanghai'
      POSTGRES_USER: aurora
      POSTGRES_PASSWORD: ${AURORA_DB_PASSWORD:?Configure_AURORA_DB_PASSWORD_in_dotenv}
      POSTGRES_DB: aurora
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - aurora


volumes:
  db-data:
  app-data:
  file-data:

networks:
  worker:
    enable_ipv6: false
    driver: bridge
    driver_opts:
      com.docker.network.enable_ipv6: "true"
    ipam:
      driver: default
      config:
        - subnet: fd00:ea23:9c80:4a54:e242:5f97::/96
          gateway: fd00:ea23:9c80:4a54:e242:5f97::1
  aurora:
    driver: bridge
