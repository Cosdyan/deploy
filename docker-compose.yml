version: '3.7'
services:
  worker:
    image: ghcr.io/cosdyan/aurora-admin-backend:latest
    restart: always
    command: bash worker.sh
    environment:
      TZ: 'Asia/Shanghai'
      PYTHONPATH: /app
      ENABLE_SENTRY: 'no'
      DATABASE_URL: 'postgresql://aurora:${AURORA_DB_PASSWORD:?Configure_AURORA_DB_PASSWORD_in_dotenv}@postgres:5432/aurora'
      ASYNC_DATABASE_URL: 'postgresql+asyncpg://aurora:${AURORA_DB_PASSWORD:?Configure_AURORA_DB_PASSWORD_in_dotenv}@postgres:5432/aurora'
      TRAFFIC_INTERVAL_SECONDS: 600
      DDNS_INTERVAL_SECONDS: 120
    volumes:
      - $HOME/.ssh/id_rsa:/app/ansible/env/ssh_key
      - app-data:/app/ansible/priv_data_dirs
    depends_on:
      - redis
    networks:
      - aurora
      - worker

  backend:
    image: ghcr.io/cosdyan/aurora-admin-backend:latest
    restart: always
    command: sh -c "alembic upgrade heads && uvicorn app.main:app --host 0.0.0.0 --port 8888"
    environment:
      TZ: 'Asia/Shanghai'
      PYTHONPATH: /app
      DATABASE_URL: 'postgresql://aurora:${AURORA_DB_PASSWORD:?Configure_AURORA_DB_PASSWORD_in_dotenv}@postgres:5432/aurora'
      ASYNC_DATABASE_URL: 'postgresql+asyncpg://aurora:${AURORA_DB_PASSWORD:?Configure_AURORA_DB_PASSWORD_in_dotenv}@postgres:5432/aurora'
      ENABLE_SENTRY: 'no'
      SECRET_KEY: ${AURORA_SECRET_KEY:?Configure_AURORA_SECRET_KEY_in_dotenv}
    volumes:
      - app-data:/app/ansible/priv_data_dirs
    depends_on:
      - postgres
      - redis
    networks:
      - aurora

  nginx:
    image: ghcr.io/cosdyan/aurora-admin-frontend:latest
    restart: always
    environment:
      TZ: 'Asia/Shanghai'
    ports:
      - 8000:80
    depends_on:
      - backend
    networks:
      - aurora

  redis:
    image: redis
    restart: always
    environment:
      TZ: 'Asia/Shanghai'
    networks:
      - aurora

  postgres:
    image: postgres:13-alpine
    restart: always
    environment:
      TZ: 'Asia/Shanghai'
      POSTGRES_USER: aurora
      POSTGRES_PASSWORD: ${AURORA_DB_PASSWORD:?Configure_AURORA_DB_PASSWORD_in_dotenv}
      POSTGRES_DB: aurora
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - aurora


volumes:
  db-data:
  app-data:

networks:
  worker:
    enable_ipv6: false
    driver: bridge
    driver_opts:
      com.docker.network.enable_ipv6: "true"
    ipam:
      driver: default
      config:
        - subnet: fd00:ea23:9c80:4a54:e242:5f97::/96
          gateway: fd00:ea23:9c80:4a54:e242:5f97::1
  aurora:
    driver: bridge
