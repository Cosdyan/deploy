name: Build Verify and Publish Aurora
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-aurora.yml
      - build/**
      - docker-compose.yml
      - docker-compose-dev.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download the original author installer requested by the user
        run: curl -fsSL https://raw.githubusercontent.com/Aurora-Admin-Panel/deploy/main/install.sh -o original-install.sh
      - name: Install original published release on a disposable VM
        id: install
        continue-on-error: true
        run: python3 tests/reference-install.py
      - name: Record original image metadata and API availability
        if: always()
        run: |
          docker images --digests
          docker ps -a
          curl -fsS http://127.0.0.1:8000/api -o original-api.json || true
          sudo sh -c 'cd /root/aurora && docker compose logs --no-color --tail=80' || true
          docker run --rm --entrypoint sh leishi1313/aurora-admin-backend:latest -c 'find app/api -name "*.py" -maxdepth 3; head -n 100 app/main.py; head -n 100 tasks/app.py' || true
      - name: Preserve original released task implementations for feature parity
        if: always()
        run: |
          docker run --rm --entrypoint python leishi1313/aurora-admin-backend:latest -c 'import pathlib,json; paths=["tasks/app.py","tasks/port.py","tasks/tc.py","tasks/traffic.py","tasks/iptables.py","tasks/utils/usage.py","tasks/utils/handlers.py","tasks/utils/server.py","tasks/utils/runner.py","app/utils/tasks.py","app/db/schemas/port.py","app/api/v1/forward_rule.py"]; print(json.dumps({p:pathlib.Path(p).read_text() for p in paths if pathlib.Path(p).is_file()}))' > original-task-source.json
          echo ORIGINAL_TASK_SOURCE_BEGIN
          cat original-task-source.json
          echo ORIGINAL_TASK_SOURCE_END
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-reference
          path: |
            original-install.sh
            original-api.json
            original-task-source.json
  resolve-sources:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.refs.outputs.backend }}
      frontend: ${{ steps.refs.outputs.frontend }}
    steps:
      - name: Pin source commits for testing and publishing
        id: refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "backend=$(gh api repos/Aurora-Admin-Panel/backend/commits/main --jq .sha)" >> "$GITHUB_OUTPUT"
          echo "frontend=$(gh api repos/Aurora-Admin-Panel/frontend/commits/main --jq .sha)" >> "$GITHUB_OUTPUT"
  isolated-tests:
    needs: resolve-sources
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:2.15.3-pg13
        env:
          POSTGRES_USER: aurora
          POSTGRES_PASSWORD: isolated_test_password
          POSTGRES_DB: aurora
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aurora -d aurora"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify Compose, shell and Nginx
        env:
          AURORA_DB_PASSWORD: isolated_test_password
          AURORA_SECRET_KEY: isolated_test_secret_for_ci_only
        run: |
          set -euo pipefail
          bash -n install.sh
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose-dev.yml config -q
          docker run --rm --add-host backend:127.0.0.1 -v "$PWD/build/frontend.nginx.conf:/etc/nginx/conf.d/default.conf:ro" nginx:1.27-alpine nginx -t
      - uses: actions/checkout@v4
        with:
          repository: Aurora-Admin-Panel/backend
          ref: ${{ needs.resolve-sources.outputs.backend }}
          path: backend-source
      - name: Apply verified backend fixes
        run: cp -R build/backend-overrides/. backend-source/
      - name: Build backend for isolated integration test
        run: docker build -t aurora-backend-ci:local backend-source
      - name: Run clean PostgreSQL migrations twice (idempotence)
        run: |
          set -euo pipefail
          for cmd in 'alembic upgrade heads' 'alembic current' 'alembic upgrade heads'; do
            docker run --rm --network host \
              -e DATABASE_URL=postgresql://aurora:isolated_test_password@127.0.0.1:5432/aurora \
              -e ASYNC_DATABASE_URL=postgresql+asyncpg://aurora:isolated_test_password@127.0.0.1:5432/aurora \
              -e REDIS_HOST=127.0.0.1 \
              -e PYTHONPATH=/app \
              -e ENABLE_SENTRY=no \
              aurora-backend-ci:local sh -c "$cmd"
          done
      - name: Confirm schema migrated
        run: |
          docker run --rm --network host -e DATABASE_URL=postgresql://aurora:isolated_test_password@127.0.0.1:5432/aurora -e PYTHONPATH=/app \
            aurora-backend-ci:local python -c "from sqlalchemy import create_engine,text; import os; c=create_engine(os.environ['DATABASE_URL']); from alembic.config import Config; from alembic.script import ScriptDirectory; conn=c.connect(); assert set(conn.execute(text('select version_num from alembic_version')).scalars()) == set(ScriptDirectory.from_config(Config('alembic.ini')).get_heads()); assert conn.execute(text(\"select count(*) from pg_extension where extname='timescaledb'\")).scalar() == 1"
      - name: Verify isolated Redis connectivity
        run: test "$(docker run --rm --network host redis:7-alpine redis-cli -h 127.0.0.1 ping)" = PONG
  frontend-regression:
    needs: resolve-sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Aurora-Admin-Panel/frontend
          ref: ${{ needs.resolve-sources.outputs.frontend }}
          path: source
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply frontend fix and build production assets
        run: |
          cp -R build/frontend-overrides/. source/
          npm --prefix source ci
          npm --prefix source run build
      - name: Test add server with and without SSH keys
        run: |
          npm install --no-save @playwright/test@1.56.1
          npx playwright install --with-deps chromium
          npx playwright test --config playwright.config.cjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: frontend-regression-failure
          path: test-results/
  isolated-stack:
    needs: resolve-sources
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Aurora-Admin-Panel/backend
          ref: ${{ needs.resolve-sources.outputs.backend }}
          path: stack-backend
      - uses: actions/checkout@v4
        with:
          repository: Aurora-Admin-Panel/frontend
          ref: ${{ needs.resolve-sources.outputs.frontend }}
          path: stack-frontend
      - name: Build exact patched production images
        run: |
          python3 -m compileall -q build/backend-overrides tests/live
          cp -R build/backend-overrides/. stack-backend/
          cp -R build/frontend-overrides/. stack-frontend/
          cp build/frontend.Dockerfile stack-frontend/Dockerfile
          cp build/frontend.nginx.conf stack-frontend/nginx.conf
          docker build -t aurora-backend-ci:local stack-backend
          docker build -t aurora-frontend-ci:local stack-frontend
      - name: Prepare SSH target on the disposable Actions VM
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server
          sudo useradd -m -s /bin/bash -G sudo aurora_ci
          echo 'aurora_ci:ci_ssh_password_123' | sudo chpasswd
          echo 'aurora_ci ALL=(ALL) NOPASSWD:ALL' | sudo tee /etc/sudoers.d/aurora-ci > /dev/null
          echo 'PasswordAuthentication yes' | sudo tee /etc/ssh/sshd_config.d/00-aurora-ci.conf > /dev/null
          sudo systemctl restart ssh
      - name: Deploy complete isolated stack and initialize administrator
        env:
          AURORA_DB_PASSWORD: ci_database_password_123
          AURORA_SECRET_KEY: ci_signing_secret_isolated_only
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          touch "$HOME/.ssh/id_rsa"
          printf 'services:\n  backend:\n    image: aurora-backend-ci:local\n  worker:\n    image: aurora-backend-ci:local\n    extra_hosts: ["host.docker.internal:host-gateway"]\n  nginx:\n    image: aurora-frontend-ci:local\n' > ci-compose.yml
          docker compose -f docker-compose.yml -f ci-compose.yml up -d
          ready=false
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8000/api/graphql -H 'Content-Type: application/json' -d '{"query":"{__typename}"}' | jq -e '.data.__typename == "Query"' >/dev/null; then ready=true; break; fi
            sleep 2
          done
          test "$ready" = true
          docker compose -f docker-compose.yml -f ci-compose.yml exec -T backend python -c 'from app.db.session import db_session; from app.db.crud.user import create_user; from app.db.schemas.user import UserCreate; db=db_session(); session=db.__enter__(); create_user(session,UserCreate(email="admin@example.invalid",password="ci_test_password_123",is_active=True,is_superuser=True)); db.__exit__(None,None,None)'
          python3 tests/live/api.py
          python3 tests/live/deployment.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exercise production UI against real backend
        run: |
          npm install --no-save @playwright/test@1.56.1
          npx playwright install --with-deps chromium
          npx playwright test --config tests/live/playwright.config.cjs
      - name: Require real legacy Ansible compatibility on the disposable SSH target
        env:
          AURORA_DB_PASSWORD: ci_database_password_123
          AURORA_SECRET_KEY: ci_signing_secret_isolated_only
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml -f ci-compose.yml exec -T worker ansible --version 2>&1 | tee legacy-compatibility.log
          docker compose -f docker-compose.yml -f ci-compose.yml exec -T worker ansible all -i 'host.docker.internal,' -u aurora_ci -m ping -e 'ansible_password=ci_ssh_password_123 ansible_ssh_common_args="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"' 2>&1 | tee -a legacy-compatibility.log
      - name: Save deployed service logs
        if: always()
        env:
          AURORA_DB_PASSWORD: ci_database_password_123
          AURORA_SECRET_KEY: ci_signing_secret_isolated_only
        run: |
          docker compose -f docker-compose.yml -f ci-compose.yml logs --no-color > isolated-stack.log
          tail -n 160 isolated-stack.log
          docker compose -f docker-compose.yml -f ci-compose.yml ps -a
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-deployment-evidence
          path: |
            live-report/
            test-results/
            isolated-stack.log
            legacy-compatibility.log
  build-candidates:
    needs: [resolve-sources, isolated-tests, frontend-regression, isolated-stack]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            source: Aurora-Admin-Panel/backend
            revision: backend
          - component: frontend
            source: Aurora-Admin-Panel/frontend
            revision: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.source }}
          ref: ${{ needs.resolve-sources.outputs[matrix.revision] }}
          path: source
      - name: Prepare frontend
        if: matrix.component == 'frontend'
        run: |
          cp build/frontend.Dockerfile source/Dockerfile
          cp build/frontend.nginx.conf source/nginx.conf
          cp -R build/frontend-overrides/. source/
      - name: Prepare backend
        if: matrix.component == 'backend'
        run: cp -R build/backend-overrides/. source/
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build AMD64 and ARM64 without publishing
        uses: docker/build-push-action@v6
        with:
          context: ./source
          file: ./source/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: type=oci,dest=/tmp/${{ matrix.component }}.tar
          labels: |
            org.opencontainers.image.revision=${{ needs.resolve-sources.outputs[matrix.revision] }}
            io.aurora.deploy.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - uses: actions/upload-artifact@v4
        with:
          name: verified-${{ matrix.component }}
          path: /tmp/${{ matrix.component }}.tar
          retention-days: 3
          if-no-files-found: error
  publish:
    needs: [resolve-sources, isolated-tests, build-candidates]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      packages: write
    concurrency:
      group: aurora-ghcr-latest
      cancel-in-progress: false
    steps:
      - name: Require successful deployment validation for this commit
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const branch = await github.rest.repos.getBranch({owner, repo, branch: 'main'});
            if (branch.data.commit.sha !== context.sha) throw new Error('Refusing to publish an outdated main commit');
            const runs = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: 'validate-deploy.yml', head_sha: context.sha, branch: 'main', per_page: 100
            });
            const run = runs.data.workflow_runs.find(r => r.head_sha === context.sha && r.conclusion === 'success');
            if (!run) throw new Error('Validate Deployment has not succeeded for this commit');
            core.info('Deployment validation: ' + run.html_url);
            await core.summary.addLink('Deployment validation', run.html_url).write();
      - uses: actions/download-artifact@v4
        with:
          pattern: verified-*
          path: verified
          merge-multiple: true
      - name: Install registry inspection tool
        run: sudo apt-get update && sudo apt-get install -y skopeo
      - name: Inspect verified candidates before publishing
        run: |
          set -euo pipefail
          for component in backend frontend; do
            skopeo inspect --raw "oci-archive:verified/$component.tar" > "$component-index.json"
            jq -e '([.manifests[].platform | select(.os == "linux") | .architecture] | unique | sort) == ["amd64","arm64"]' "$component-index.json"
          done
      - name: Publish verified AMD64 and ARM64 images and verify latest
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" | skopeo login ghcr.io --username "$REGISTRY_USER" --password-stdin
          for component in backend frontend; do
            target="ghcr.io/cosdyan/aurora-admin-$component"
            skopeo copy --all --preserve-digests "oci-archive:verified/$component.tar" "docker://$target:latest"
            skopeo inspect --raw "docker://$target:latest" > "$component-published.json"
            cmp "$component-index.json" "$component-published.json"
            digest=$(skopeo manifest-digest "$component-published.json")
            echo "$target:latest $digest"
            echo "- $target:latest: $digest (AMD64/ARM64; registry manifest matches verified artifact)" >> "$GITHUB_STEP_SUMMARY"
          done
