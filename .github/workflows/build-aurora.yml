name: Build Aurora Images
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-aurora.yml
      - build/**
      - docker-compose.yml
      - docker-compose-dev.yml
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            source: Aurora-Admin-Panel/backend
            dockerfile: Dockerfile
          - component: frontend
            source: Aurora-Admin-Panel/frontend
            dockerfile: Dockerfile
    steps:
      - name: Checkout deploy
        uses: actions/checkout@v4
      - name: Checkout Aurora source
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.source }}
          ref: main
          path: source
      - name: Prepare frontend build
        if: matrix.component == 'frontend'
        run: |
          cp build/frontend.Dockerfile source/Dockerfile
          cp build/frontend.nginx.conf source/nginx.conf
      - uses: docker/setup-buildx-action@v3
      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: ./source
          file: ./source/${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/cosdyan/aurora-admin-${{ matrix.component }}:latest
            ghcr.io/cosdyan/aurora-admin-${{ matrix.component }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
